 <style>
 #missing-part-game{font-family:Tahoma,Arial,sans-serif;color:#19364c;background:#eef8ff;border-radius:24px;padding:24px;text-align:center;box-sizing:border-box}
 #missing-part-game *{box-sizing:border-box}
 #missing-part-game h2{font-size:clamp(24px,5vw,36px);margin:8px 0 14px;color:#224a85}
 #missing-part-game .status{font-size:22px;min-height:38px;margin:16px 0;color:#27465d;font-weight:bold}
 #missing-part-game .pieces{position:relative;margin:8px auto 20px;max-width:640px;overflow:hidden;aspect-ratio:640/430}
 #missing-part-game .scene{position:absolute;top:0;left:0;width:640px;height:430px;transform:scale(var(--scene-scale,1));transform-origin:top left;direction:ltr}
 #missing-part-game .desk-top{position:absolute;left:25px;top:248px;width:590px;height:100px;background:#edbd7c;clip-path:polygon(8% 0,92% 0,100% 82%,0 82%);border-radius:10px}
 #missing-part-game .desk-edge{position:absolute;left:25px;top:327px;width:590px;height:20px;background:#c78e50;border-radius:0 0 8px 8px}
 #missing-part-game .leg{position:absolute;top:345px;width:20px;height:69px;background:#a87847;border-radius:0 0 5px 5px}
 #missing-part-game .leg.left{left:55px}#missing-part-game .leg.right{right:55px}
 #missing-part-game .piece{position:absolute;display:flex;align-items:center;justify-content:center}
 #missing-part-game .piece.p0{left:215px;top:43px;width:230px;height:210px;align-items:flex-start}
 #missing-part-game .piece.p1{left:468px;top:270px;width:45px;height:61px}
 #missing-part-game .piece.p2{left:215px;top:272px;width:220px;height:61px}
 #missing-part-game .piece.p3{left:95px;top:92px;width:98px;height:163px}
 #missing-part-game .drawing{display:contents}
 #missing-part-game .piece.is-missing{visibility:hidden}
 #missing-part-game .monitor{width:138px;height:91px;border:9px solid #34455a;border-radius:10px;background:#76cbed;position:relative;box-shadow:inset 0 0 0 3px #ade7f6}
 #missing-part-game .monitor:before{content:'';position:absolute;width:17px;height:27px;background:#34455a;bottom:-32px;left:52px}
 #missing-part-game .monitor:after{content:'';position:absolute;width:76px;height:9px;border-radius:10px;background:#34455a;bottom:-37px;left:23px}
 #missing-part-game .keyboard{width:144px;height:70px;background:#34455a;padding:8px;border-radius:10px;display:grid;grid-template-columns:repeat(8,1fr);gap:4px;transform:perspective(220px) rotateX(15deg)}
 #missing-part-game .key{background:#e8f0f9;border-radius:2px;height:10px}
 #missing-part-game .space{grid-column:3/7;background:#f7c95b;border-radius:3px;height:11px}
 #missing-part-game .mouse{width:67px;height:101px;border-radius:40px 40px 35px 35px;background:#faaf55;border:4px solid #ba702d;position:relative}
 #missing-part-game .mouse:before{content:'';position:absolute;top:0;left:29px;height:38px;width:3px;background:#ba702d}
 #missing-part-game .mouse:after{content:'';position:absolute;top:12px;left:24px;width:11px;height:20px;border-radius:8px;background:#34455a}
 #missing-part-game .tower{width:77px;height:126px;background:#485b71;border:5px solid #2c3b4f;border-radius:10px;position:relative}
 #missing-part-game .tower:before{content:'';position:absolute;top:15px;left:8px;width:51px;height:8px;background:#202e3f;border-radius:2px;box-shadow:0 16px #202e3f}
 #missing-part-game .tower:after{content:'⏻';position:absolute;bottom:15px;left:19px;font-size:28px;color:#87ebd1}
 #missing-part-game .question{font-size:78px;color:#6952bb;font-weight:bold}
 #missing-part-game .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
 #missing-part-game button{font:700 21px Tahoma,Arial,sans-serif;padding:15px 25px;border:0;border-radius:16px;background:#235aab;color:#fff;min-height:52px}
 #missing-part-game button:disabled{opacity:.5}
 #missing-part-game button:focus-visible{outline:3px solid #f2a423;outline-offset:4px}
 #missing-part-game .secondary{background:#fff;color:#285291;border:2px solid #bed7f3}
 #missing-part-game .round{color:#576e83;font-size:16px}
 #missing-part-game .stars{display:flex;justify-content:center;gap:10px;margin:12px 0;font-size:30px;color:#d39210}
 #missing-part-game .choices{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin:0 0 18px}
 #missing-part-game .choices[hidden]{display:none}
 #missing-part-game .choice-group{display:flex;gap:5px;align-items:stretch;max-width:100%}
 #missing-part-game .choice-name{background:#fff;color:#224a85;border:2px solid #b9d2f3;white-space:normal}
 #missing-part-game .listen{background:#e0eafa;color:#224a85;padding:12px;min-width:52px}
 #missing-part-game .choice-name.correct{background:#d8f2dc;color:#205c32;border-color:#67b57a}
 #missing-part-game .choice-name.wrong{background:#ffe5df;color:#8b3424;border-color:#df9586}
 #missing-part-game .audio-note{font-size:14px;color:#785628;margin:8px 0}
 #missing-part-game .piece.answer{filter:drop-shadow(0 0 9px #f5bf3c)}
 #missing-part-game .p0 .monitor{width:230px;height:155px;border-width:12px;background:linear-gradient(135deg,#b0eeff,#64bee9)}
 #missing-part-game .p0 .monitor:before{width:24px;height:43px;bottom:-53px;left:91px}
 #missing-part-game .p0 .monitor:after{width:110px;height:12px;bottom:-60px;left:48px}
 #missing-part-game .p2 .keyboard{width:220px;height:61px;grid-template-columns:repeat(8,1fr);padding:7px;gap:3px}
 #missing-part-game .p2 .key{height:8px}#missing-part-game .p2 .space{height:8px}
 #missing-part-game .p1 .mouse{width:43px;height:61px;border-width:3px}

 /* Bright classroom theme, with a single clear play surface. */

 #missing-part-game .round{display:inline-block;background:#d6f3ff;color:#14608a;padding:8px 20px;border-radius:22px;font-weight:bold}
 #missing-part-game h2{color:#185399;text-shadow:0 2px #fff;margin-top:18px}
 #missing-part-game .status{color:#39546b;font-size:clamp(18px,3vw,24px)}
 #missing-part-game .pieces{border-radius:24px;background:radial-gradient(circle at 15% 14%,#fff 0 3%,transparent 3.3%),radial-gradient(circle at 87% 22%,#fff 0 4%,transparent 4.3%),linear-gradient(#c2edff 0 72%,#a4dcec 72% 73%,#d5eff6 73%);border:3px solid #a4dbea}
 #missing-part-game button{box-shadow:0 5px 0 #164279;transition:transform .15s,box-shadow .15s;font-size:clamp(20px,3vw,25px)}
 #missing-part-game button:not(:disabled):active{transform:translateY(3px);box-shadow:0 2px 0 #164279}
 #missing-part-game #mp-main{background:#ffcc48;color:#53380c;box-shadow:0 5px 0 #dda12a;min-width:170px}
 #missing-part-game .choice-name{border:3px solid #73b9e7;background:#fff;color:#155283;box-shadow:0 5px 0 #a3cee8;min-width:140px}
 #missing-part-game .listen{background:#d5f3ff;box-shadow:0 5px 0 #93cce5;border-radius:16px}
 #missing-part-game .stars{gap:12px;margin:14px 0}
 #missing-part-game .star{display:inline-block;font-size:40px;line-height:1;color:#a9c4d4;text-shadow:0 2px #fff}
 #missing-part-game .star.earned{color:#ffc52e;text-shadow:0 2px #d69413;transform:rotate(-7deg)}
 #missing-part-game .choice-name.correct{border-color:#62b57d;box-shadow:0 5px 0 #8fc69e;background:#dcf9dd}
 #missing-part-game .choice-name.wrong{border-color:#e59c90;box-shadow:0 5px 0 #e7b4ab}
 #missing-part-game footer{background:#e3f5fc;border:0!important;border-radius:18px;padding:16px!important;font-weight:bold}
 #missing-part-game footer .year{font-size:15px;font-weight:normal;margin-top:6px;color:#557183}
 #missing-part-game .confetti{position:absolute;z-index:10;top:30%;left:50%;width:10px;height:17px;border-radius:3px;pointer-events:none;animation:mp-pop 1.2s ease-out forwards}
 @keyframes mp-pop{from{transform:translate(0,0) rotate(0deg);opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(var(--rotation));opacity:0}}

 let currentNameAudio=null;
 function speak(text){
 if(currentNameAudio){currentNameAudio.pause();currentNameAudio.currentTime=0;}
 if(recordedNames[text]){
 if("speechSynthesis" in window)window.speechSynthesis.cancel();
 currentNameAudio=new Audio(recordedNames[text]);currentNameAudio.volume=1;audioNote.hidden=true;
 currentNameAudio.play().catch(()=>{audioNote.hidden=false;audioNote.textContent="تعذّر تشغيل الصوت. تأكد من تشغيل صوت الجهاز ثم اضغط 🔊 مجددًا.";});return;
 }
 if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){audioNote.hidden=false;audioNote.textContent='الصوت غير متاح هنا؛ جرّبي اللعبة في متصفح يدعم النطق.';return;}
 try{
 window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang='ar-SA';utterance.rate=.8;
 const voice=window.speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('ar'));if(voice)utterance.voice=voice;
 utterance.onerror=()=>{audioNote.hidden=false;audioNote.textContent='تعذّر تشغيل الصوت العربي على هذا الجهاز.';};
 utterance.onstart=()=>{audioNote.hidden=true;};window.speechSynthesis.speak(utterance);
 }catch(e){audioNote.hidden=false;audioNote.textContent='تعذّر تشغيل الصوت على هذا الجهاز.';}
 }
 function applause(){try{
 const AudioClass=window.AudioContext||window.webkitAudioContext;if(!AudioClass)return;
 audioContext=audioContext||new AudioClass();audioContext.resume();
 // Layer several staggered pairs of handclaps, with warm filtering and room echo.
 const start=audioContext.currentTime+.02;
 const master=audioContext.createGain();master.gain.value=.48;
 const compressor=audioContext.createDynamicsCompressor();compressor.threshold.value=-20;compressor.ratio.value=5;
 master.connect(compressor);compressor.connect(audioContext.destination);
 const delay=audioContext.createDelay(.3),echo=audioContext.createGain();delay.delayTime.value=.085;echo.gain.value=.16;master.connect(delay);delay.connect(echo);echo.connect(compressor);
 for(let person=0;person<7;person++){
 const interval=.16+Math.random()*.085,offset=Math.random()*.13;
 for(let clap=0;clap<6;clap++){
 const when=start+offset+clap*interval;
 const buffer=audioContext.createBuffer(1,Math.floor(audioContext.sampleRate*.11),audioContext.sampleRate),data=buffer.getChannelData(0);
 let smooth=0;
 for(let j=0;j<data.length;j++){const t=j/audioContext.sampleRate;const noise=Math.random()*2-1;smooth=smooth*.45+noise*.55;const attack=Math.min(1,t/.0015);data[j]=(noise*.25+smooth*.75)*attack*(Math.exp(-t/.012)+.35*Math.exp(-Math.max(0,t-.012)/.027))*.32;}
 const source=audioContext.createBufferSource(),filter=audioContext.createBiquadFilter(),pan=audioContext.createStereoPanner(),gain=audioContext.createGain();
 source.buffer=buffer;source.playbackRate.value=.8+Math.random()*.35;filter.type='bandpass';filter.frequency.value=1050+Math.random()*1300;filter.Q.value=.65;pan.pan.value=(person-3)/4;gain.gain.value=.65+Math.random()*.35;
 source.connect(filter);filter.connect(pan);pan.connect(gain);gain.connect(master);source.start(when);source.onended=()=>{source.disconnect();filter.disconnect();pan.disconnect();gain.disconnect();};
 }}
 setTimeout(()=>{master.disconnect();delay.disconnect();echo.disconnect();compressor.disconnect();},2200);
 }catch(e){}}
 function celebrate(){for(let i=0;i<22;i++){const bit=document.createElement('span');bit.className='confetti';bit.setAttribute('aria-hidden','true');bit.style.background=['#ffca3a','#24b8d8','#ff7f86','#6dcc95'][i%4];bit.style.setProperty('--dx',((Math.random()-.5)*420)+'px');bit.style.setProperty('--dy',(100+Math.random()*180)+'px');bit.style.setProperty('--rotation',(Math.random()*540)+'deg');root.append(bit);setTimeout(()=>bit.remove(),1300);}}
 function drawStars(){stars.innerHTML=Array.from({length:4},(_,i)=>'<span class="star '+(i<score?'earned':'')+'" aria-hidden="true">'+(i<score?'★':'☆')+'</span>').join('');stars.setAttribute('aria-label',score+' من أربع نجوم');}
 function showChoices(){
 const other=parts.map((_,id)=>id).filter(id=>id!==missing);const distractor=other[Math.floor(Math.random()*other.length)];const ids=Math.random()<.5?[missing,distractor]:[distractor,missing];
 choices.innerHTML=ids.map(id=>'<div class="choice-group"><button type="button" class="choice-name cursor-interaction" data-answer="'+id+'">'+parts[id].name+'</button><button type="button" class="listen cursor-interaction" data-sound="'+id+'" aria-label="اسمع اسم '+parts[id].name+'">🔊</button></div>').join('');choices.hidden=false;
 }
 const arabic=n=>n.toLocaleString('ar');
 function draw(){
 board.innerHTML='<div class="scene"><div class="desk-top" aria-hidden="true"></div><div class="desk-edge" aria-hidden="true"></div><div class="leg left" aria-hidden="true"></div><div class="leg right" aria-hidden="true"></div>'+parts.map((part,id)=>{const hidden=phase==='guess'&&id===missing;return '<div class="piece p'+id+' '+(hidden?'is-missing':'')+' '+(phase==='answer'&&id===missing?'answer':'')+'" role="img" aria-label="'+part.name+'" '+(hidden?'aria-hidden="true"':'')+'><div class="drawing">'+part.html+'</div></div>';}).join('')+'</div>';
 roundText.textContent=phase==='look'?'هل أنت مستعد؟':'السؤال '+arabic(round+1)+' من ٤';
 board.style.setProperty('--scene-scale',board.clientWidth/640);
 }
 function start(){clearTimeout(transitionTimer);phase='look';missing=-1;choices.hidden=true;choices.innerHTML='';audioNote.hidden=true;status.textContent='انظروا إلى الحاسوب جيدًا 👀';main.textContent='ابدأ ▶';main.hidden=false;next.hidden=true;drawStars();draw();}
 function question(){if(currentNameAudio){currentNameAudio.pause();currentNameAudio.currentTime=0;}if('speechSynthesis' in window)window.speechSynthesis.cancel();missing=order[round];phase='guess';status.textContent='ما الجزء الذي اختفى؟ اختر اسمه 👇';main.hidden=true;next.hidden=true;draw();showChoices();}
 main.addEventListener('click',()=>{
 if(phase==='look'){
 question();
 }
 });
 choices.addEventListener('click',event=>{
 const sound=event.target.closest('[data-sound]');if(sound){speak(parts[Number(sound.dataset.sound)].name);return;}
 const answer=event.target.closest('[data-answer]');if(!answer||phase!=='guess')return;
 const id=Number(answer.dataset.answer);
 if(id!==missing){answer.classList.add('wrong');status.textContent='حاول مرة أخرى 💪';speak('حاول مرة أخرى');return;}
 phase='answer';score++;answer.classList.add('correct');choices.querySelectorAll('button').forEach(b=>b.disabled=true);status.textContent=round===3?'أحسنت! جمعت أربع نجوم ⭐':'أحسنت! هذا الجزء هو '+parts[missing].name+' ⭐';drawStars();draw();applause();celebrate();
 if(round===3){choices.hidden=true;next.hidden=false;next.textContent='العب من جديد ↻';}
 else{transitionTimer=setTimeout(()=>{round++;question();},1500);}
 });
 next.addEventListener('click',()=>{round=0;score=0;shuffle();if('speechSynthesis' in window)window.speechSynthesis.cancel();start();});
 const observer=new ResizeObserver(()=>board.style.setProperty('--scene-scale',board.clientWidth/640));observer.observe(board);start();
 })();
